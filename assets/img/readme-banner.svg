<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300">
  <defs>
    <linearGradient id="leafgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55B884"/>
      <stop offset="52%" stop-color="#9AC540"/>
      <stop offset="100%" stop-color="#E0963B"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55B884"/>
      <stop offset="65%" stop-color="#9AC540"/>
      <stop offset="100%" stop-color="#AACC42"/>
    </linearGradient>
    <radialGradient id="rglow" cx="78%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#55B884" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#55B884" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground -->
  <rect width="1280" height="300" fill="#1F3D2B"/>
  <rect width="1280" height="300" fill="url(#rglow)"/>

  <!-- Concentric ghost rings, far right -->
  <g fill="none" stroke="#9AC540" stroke-width="1" opacity="0.07">
    <circle cx="1180" cy="150" r="68"/>
    <circle cx="1180" cy="150" r="110"/>
    <circle cx="1180" cy="150" r="156"/>
    <circle cx="1180" cy="150" r="208"/>
    <circle cx="1180" cy="150" r="266"/>
  </g>

  <!-- Leaf mark icon (scaled 0.72 from 200×200) -->
  <g transform="translate(60, 48) scale(0.72)">
    <rect width="200" height="200" rx="44" fill="rgba(255,255,255,0.06)"/>
    <path d="M46,44 C106,47 158,92 160,146 C100,150 52,106 46,44 Z" fill="url(#leafgrad)"/>
    <path d="M52,53 C90,92 128,124 156,144" fill="none" stroke="#EAF3EC" stroke-width="9" stroke-linecap="round" opacity=".82"/>
    <path d="M160,146 C178,163 182,181 174,196" fill="none" stroke="#C8612A" stroke-width="8.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark with terracotta period accent -->
  <text
    x="214" y="182"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="114"
    font-weight="700"
    letter-spacing="-3">
    <tspan fill="url(#textgrad)">Mål</tspan><tspan fill="#C8612A" dx="4" font-size="96">.</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="216" y="226"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="4"
    fill="#5A9970">EAT WITH INTENTION</text>
</svg>
