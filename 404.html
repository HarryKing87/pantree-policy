<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Mål</title>
<script>
  /* GitHub Pages serves this for any unknown path.
     Bounce back into the single-page app, keeping any hash intact. */
  (function () {
    var base = location.pathname.replace(/\/[^/]*$/, '/');
    location.replace(base + (location.hash || ''));
  })();
</script>
<meta http-equiv="refresh" content="0;url=./">
</head>
<body style="margin:0;background:#F6F8F3;color:#16211A;font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh">
  <p>Redirecting to <a href="./" style="color:#3F7D5C">Mål</a>…</p>
</body>
</html>
